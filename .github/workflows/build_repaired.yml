name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Project Files
        run: |
          mkdir -p app/src/main/java/com/localshorts/app

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "LocalShorts"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.localshorts.app"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.localshorts.app"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
          }
          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
              implementation(composeBom)
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.2")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.documentfile:documentfile:1.0.1")
              implementation("androidx.media3:media3-exoplayer:1.3.1")
              implementation("androidx.media3:media3-ui:1.3.1")
              implementation("io.coil-kt:coil-compose:2.6.0")
              implementation("io.coil-kt:coil-video:2.6.0")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="LocalShorts"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/localshorts/app/MainActivity.kt
          package com.localshorts.app

          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.media.AudioManager
          import android.net.Uri
          import android.os.Bundle
          import android.view.ViewGroup
          import android.widget.FrameLayout
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.BackHandler
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.annotation.OptIn
          import androidx.compose.animation.AnimatedVisibility
          import androidx.compose.animation.fadeIn
          import androidx.compose.animation.fadeOut
          import androidx.compose.foundation.Canvas
          import androidx.compose.foundation.ExperimentalFoundationApi
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.gestures.detectTapGestures
          import androidx.compose.foundation.gestures.detectVerticalDragGestures
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.LazyRow
          import androidx.compose.foundation.lazy.grid.GridCells
          import androidx.compose.foundation.lazy.grid.LazyVerticalGrid
          import androidx.compose.foundation.lazy.grid.itemsIndexed
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.pager.VerticalPager
          import androidx.compose.foundation.pager.rememberPagerState
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.geometry.CornerRadius
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.Path
          import androidx.compose.ui.input.pointer.pointerInput
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.compose.ui.viewinterop.AndroidView
          import androidx.documentfile.provider.DocumentFile
          import androidx.media3.common.MediaItem
          import androidx.media3.common.PlaybackParameters
          import androidx.media3.common.Player
          import androidx.media3.common.util.UnstableApi
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.ui.AspectRatioFrameLayout
          import androidx.media3.ui.PlayerView
          import coil.ImageLoader
          import coil.compose.AsyncImage
          import coil.decode.VideoFrameDecoder
          import coil.request.ImageRequest
          import coil.request.videoFrameMillis
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import kotlin.math.roundToInt

          enum class EndBehavior(val label: String) { LOOP("Loop Current"), NEXT("Play Next"), STOP("Stop") }
          data class VideoFile(val uri: Uri, val name: String, val folderUri: String, val folderName: String)
          data class AccentPreset(val name: String, val hex: Long)
          val ACCENT_PRESETS = listOf(
              AccentPreset("Red", 0xFFFF0033), AccentPreset("Blue", 0xFF2979FF),
              AccentPreset("Green", 0xFF00E676), AccentPreset("Purple", 0xFFD500F9), AccentPreset("Orange", 0xFFFF6D00)
          )

          class PrefsManager(context: Context) {
              private val prefs = context.getSharedPreferences("local_shorts_prefs", Context.MODE_PRIVATE)
              var columns: Int get() = prefs.getInt("columns", 2).coerceIn(1, 4); set(v) = prefs.edit().putInt("columns", v.coerceIn(1, 4)).apply()
              var accentHex: Long get() = prefs.getLong("accent_hex", 0xFFFF0033); set(v) = prefs.edit().putLong("accent_hex", v).apply()
              var endBehavior: EndBehavior get() = EndBehavior.valueOf(prefs.getString("end_behavior", EndBehavior.LOOP.name) ?: EndBehavior.LOOP.name); set(v) = prefs.edit().putString("end_behavior", v.name).apply()
              var brightnessGesture: Boolean get() = prefs.getBoolean("brightness_gesture", true); set(v) = prefs.edit().putBoolean("brightness_gesture", v).apply()
              var volumeGesture: Boolean get() = prefs.getBoolean("volume_gesture", true); set(v) = prefs.edit().putBoolean("volume_gesture", v).apply()
              fun getFolders(): Set<String> = prefs.getStringSet("folders", emptySet()) ?: emptySet()
              fun addFolder(u: String) { prefs.edit().putStringSet("folders", getFolders().toMutableSet().apply { add(u) }).apply() }
              fun removeFolder(u: String) { prefs.edit().putStringSet("folders", getFolders().toMutableSet().apply { remove(u) }).apply() }
              fun getViewCount(u: String): Int = prefs.getInt("views_$u", 0)
              fun incrementViewCount(u: String): Int { val n = getViewCount(u) + 1; prefs.edit().putInt("views_$u", n).apply(); return n }
          }

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent { LocalShortsApp() }
              }
          }

          @Composable
          fun LocalShortsApp() {
              val context = LocalContext.current
              val prefs = remember { PrefsManager(context) }
              val scope = rememberCoroutineScope()
              var accentHex by remember { mutableLongStateOf(prefs.accentHex) }
              val accentColor = Color(accentHex)
              var columns by remember { mutableIntStateOf(prefs.columns) }
              var endBehavior by remember { mutableStateOf(prefs.endBehavior) }
              var brightnessGesture by remember { mutableStateOf(prefs.brightnessGesture) }
              var volumeGesture by remember { mutableStateOf(prefs.volumeGesture) }
              var folderUris by remember { mutableStateOf(prefs.getFolders().toList()) }
              var selectedFolder by remember { mutableStateOf<String?>(null) }
              var searchQuery by remember { mutableStateOf("") }
              var allVideos by remember { mutableStateOf<List<VideoFile>>(emptyList()) }
              var isScanning by remember { mutableStateOf(false) }
              val viewCounts = remember { mutableStateMapOf<String, Int>() }
              var currentScreen by remember { mutableStateOf("LIBRARY") }
              var activeVideoIndex by remember { mutableIntStateOf(0) }
              val imageLoader = remember { ImageLoader.Builder(context).components { add(VideoFrameDecoder.Factory()) }.build() }

              fun rescanDirectories(uris: List<String>) {
                  scope.launch {
                      isScanning = true
                      val loaded = withContext(Dispatchers.IO) {
                          val list = mutableListOf<VideoFile>()
                          uris.forEach { uriStr ->
                              val docTree = DocumentFile.fromTreeUri(context, Uri.parse(uriStr))
                              val folderName = docTree?.name ?: "Folder"
                              docTree?.listFiles()?.forEach { file ->
                                  if (file.isFile && (file.type?.startsWith("video/") == true ||
                                      file.name?.endsWith(".mp4", true) == true || file.name?.endsWith(".mkv", true) == true ||
                                      file.name?.endsWith(".webm", true) == true || file.name?.endsWith(".mov", true) == true)) {
                                      list.add(VideoFile(file.uri, file.name?.substringBeforeLast(".") ?: "Untitled", uriStr, folderName))
                                  }
                              }
                          }
                          list.sortedBy { it.name.lowercase() }
                      }
                      loaded.forEach { v -> viewCounts[v.uri.toString()] = prefs.getViewCount(v.uri.toString()) }
                      allVideos = loaded
                      isScanning = false
                  }
              }

              LaunchedEffect(folderUris) { rescanDirectories(folderUris) }

              val folderPickerLauncher = rememberLauncherForActivityResult(ActivityResultContracts.OpenDocumentTree()) { uri ->
                  uri?.let {
                      context.contentResolver.takePersistableUriPermission(it, Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      prefs.addFolder(it.toString())
                      folderUris = prefs.getFolders().toList()
                  }
              }

              val filteredVideos = remember(allVideos, selectedFolder, searchQuery) {
                  allVideos.filter { (selectedFolder == null || it.folderUri == selectedFolder) && (searchQuery.isBlank() || it.name.contains(searchQuery, true)) }
              }

              MaterialTheme(colorScheme = darkColorScheme(primary = accentColor, background = Color(0xFF0F0F0F), surface = Color(0xFF1A1A1A))) {
                  Surface(modifier = Modifier.fillMaxSize(), color = MaterialTheme.colorScheme.background) {
                      when (currentScreen) {
                          "LIBRARY" -> LibraryScreen(
                              videos = filteredVideos, folderUris = folderUris, selectedFolder = selectedFolder,
                              onSelectFolder = { selectedFolder = it }, searchQuery = searchQuery, onSearchChange = { searchQuery = it },
                              columns = columns, onCycleColumns = { val n = (columns % 4) + 1; columns = n; prefs.columns = n },
                              accentColor = accentColor, viewCounts = viewCounts, imageLoader = imageLoader, isScanning = isScanning,
                              onAddFolder = { folderPickerLauncher.launch(null) }, onOpenSettings = { currentScreen = "SETTINGS" },
                              onVideoClick = { activeVideoIndex = it; currentScreen = "PLAYER" }
                          )
                          "PLAYER" -> ShortsPlayerScreen(
                              videos = filteredVideos, initialIndex = activeVideoIndex, accentColor = accentColor,
                              endBehavior = endBehavior, brightnessGesture = brightnessGesture, volumeGesture = volumeGesture,
                              onIncrementView = { viewCounts[it] = prefs.incrementViewCount(it) }, onBack = { currentScreen = "LIBRARY" }
                          )
                          "SETTINGS" -> SettingsScreen(
                              accentHex = accentHex, onAccentChange = { accentHex = it; prefs.accentHex = it },
                              columns = columns, onColumnsChange = { columns = it; prefs.columns = it },
                              endBehavior = endBehavior, onEndBehaviorChange = { endBehavior = it; prefs.endBehavior = it },
                              brightnessGesture = brightnessGesture, onBrightnessGestureChange = { brightnessGesture = it; prefs.brightnessGesture = it },
                              volumeGesture = volumeGesture, onVolumeGestureChange = { volumeGesture = it; prefs.volumeGesture = it },
                              folderUris = folderUris, onAddFolder = { folderPickerLauncher.launch(null) },
                              onRemoveFolder = { prefs.removeFolder(it); folderUris = prefs.getFolders().toList(); if (selectedFolder == it) selectedFolder = null },
                              onBack = { currentScreen = "LIBRARY" }
                          )
                      }
                  }
              }
          }

          @Composable
          fun ShortsLogo(accentColor: Color) {
              Canvas(modifier = Modifier.size(34.dp)) {
                  drawRoundRect(color = accentColor, cornerRadius = CornerRadius(24f, 24f), size = size)
                  val path = Path().apply {
                      moveTo(size.width * 0.36f, size.height * 0.24f)
                      lineTo(size.width * 0.72f, size.height * 0.50f)
                      lineTo(size.width * 0.36f, size.height * 0.76f)
                      close()
                  }
                  drawPath(path = path, color = Color.White)
              }
          }

          @Composable
          fun LibraryScreen(
              videos: List<VideoFile>, folderUris: List<String>, selectedFolder: String?, onSelectFolder: (String?) -> Unit,
              searchQuery: String, onSearchChange: (String) -> Unit, columns: Int, onCycleColumns: () -> Unit,
              accentColor: Color, viewCounts: Map<String, Int>, imageLoader: ImageLoader, isScanning: Boolean,
              onAddFolder: () -> Unit, onOpenSettings: () -> Unit, onVideoClick: (Int) -> Unit
          ) {
              val context = LocalContext.current
              Column(modifier = Modifier.fillMaxSize()) {
                  Row(modifier = Modifier.fillMaxWidth().padding(horizontal = 12.dp, vertical = 10.dp), verticalAlignment = Alignment.CenterVertically) {
                      ShortsLogo(accentColor)
                      Spacer(Modifier.width(10.dp))
                      OutlinedTextField(
                          value = searchQuery, onValueChange = onSearchChange,
                          placeholder = { Text("Search shorts...", fontSize = 14.sp, color = Color.Gray) },
                          leadingIcon = { Icon(Icons.Default.Search, null, tint = Color.Gray) },
                          singleLine = true, shape = RoundedCornerShape(28.dp),
                          modifier = Modifier.weight(1f).height(50.dp)
                      )
                      Spacer(Modifier.width(6.dp))
                      FilledTonalIconButton(onClick = onCycleColumns) { Text("${columns}x", fontWeight = FontWeight.Bold, color = accentColor) }
                      IconButton(onClick = onOpenSettings) { Icon(Icons.Default.Settings, null, tint = Color.White) }
                  }
                  LazyRow(modifier = Modifier.fillMaxWidth().padding(horizontal = 12.dp, vertical = 4.dp), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      item { FilterChip(selected = selectedFolder == null, onClick = { onSelectFolder(null) }, label = { Text("All Folders") }) }
                      items(folderUris) { uriStr ->
                          val name = remember(uriStr) { DocumentFile.fromTreeUri(context, Uri.parse(uriStr))?.name ?: "Folder" }
                          FilterChip(selected = selectedFolder == uriStr, onClick = { onSelectFolder(uriStr) }, label = { Text(name) })
                      }
                      item { AssistChip(onClick = onAddFolder, label = { Text("+ Add Folder") }) }
                  }
                  if (isScanning) LinearProgressIndicator(modifier = Modifier.fillMaxWidth(), color = accentColor)
                  if (videos.isEmpty() && !isScanning) {
                      Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                      Button(onClick = onAddFolder, colors = ButtonDefaults.buttonColors(containerColor = accentColor)) { Text("Add Video Folder") }
                      }
                  } else {
                      LazyVerticalGrid(columns = GridCells.Fixed(columns), contentPadding = PaddingValues(8.dp), horizontalArrangement = Arrangement.spacedBy(8.dp), verticalArrangement = Arrangement.spacedBy(8.dp), modifier = Modifier.fillMaxSize()) {
                          itemsIndexed(videos, key = { _, item -> item.uri.toString() }) { index, video ->
                              val views = viewCounts[video.uri.toString()] ?: 0
                              Box(modifier = Modifier.fillMaxWidth().aspectRatio(9f / 16f).clip(RoundedCornerShape(12.dp)).background(Color(0xFF1E1E1E)).clickable { onVideoClick(index) }) {
                                  AsyncImage(
                                      model = ImageRequest.Builder(context).data(video.uri).videoFrameMillis(500).crossfade(true).build(),
                                      imageLoader = imageLoader, contentDescription = video.name, contentScale = ContentScale.Crop, modifier = Modifier.fillMaxSize()
                                  )
                                  Box(modifier = Modifier.fillMaxWidth().height(64.dp).align(Alignment.BottomCenter).background(Brush.verticalGradient(listOf(Color.Transparent, Color.Black.copy(alpha = 0.8f)))))
                                  Column(modifier = Modifier.align(Alignment.BottomStart).padding(8.dp)) {
                                      Text(video.name, color = Color.White, fontSize = 12.sp, fontWeight = FontWeight.SemiBold, maxLines = 1, overflow = TextOverflow.Ellipsis)
                                      Text("$views views", color = Color.LightGray, fontSize = 11.sp)
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @OptIn(ExperimentalFoundationApi::class, UnstableApi::class, ExperimentalMaterial3Api::class)
          @Composable
          fun ShortsPlayerScreen(
              videos: List<VideoFile>, initialIndex: Int, accentColor: Color, endBehavior: EndBehavior,
              brightnessGesture: Boolean, volumeGesture: Boolean, onIncrementView: (String) -> Unit, onBack: () -> Unit
          ) {
              BackHandler(onBack = onBack)
              val context = LocalContext.current
              val activity = context as? Activity
              val audioManager = remember { context.getSystemService(Context.AUDIO_SERVICE) as AudioManager }
              val scope = rememberCoroutineScope()
              val pagerState = rememberPagerState(initialPage = initialIndex.coerceIn(0, (videos.size - 1).coerceAtLeast(0)), pageCount = { videos.size })
              var playbackSpeed by remember { mutableFloatStateOf(1.0f) }
              var showSpeedSheet by remember { mutableStateOf(false) }
              var hudText by remember { mutableStateOf<String?>(null) }

              LaunchedEffect(hudText) { if (hudText != null) { delay(800); hudText = null } }

              Box(modifier = Modifier.fillMaxSize().background(Color.Black)) {
                  VerticalPager(state = pagerState, modifier = Modifier.fillMaxSize(), beyondBoundsPageCount = 1) { pageIndex ->
                      val video = videos[pageIndex]
                      SingleShortPlayerPage(
                          video = video, isCurrentPage = pagerState.currentPage == pageIndex, accentColor = accentColor,
                          playbackSpeed = playbackSpeed, endBehavior = endBehavior, brightnessGesture = brightnessGesture, volumeGesture = volumeGesture,
                          onOpenSpeedMenu = { showSpeedSheet = true }, onIncrementView = { onIncrementView(video.uri.toString()) },
                          onAdvanceNext = { if (pageIndex + 1 < videos.size) scope.launch { pagerState.animateScrollToPage(pageIndex + 1) } },
                          onBrightnessDelta = { deltaY ->
                              activity?.window?.let { w ->
                                  val p = w.attributes
                                  val cur = if (p.screenBrightness < 0f) 0.5f else p.screenBrightness
                                  val upd = (cur - deltaY / 800f).coerceIn(0.05f, 1.0f)
                                  p.screenBrightness = upd; w.attributes = p
                                  hudText = "Brightness ${(upd * 100).roundToInt()}%"
                              }
                          },
                          onVolumeDelta = { deltaY ->
                              val maxV = audioManager.getStreamMaxVolume(AudioManager.STREAM_MUSIC)
                              val curV = audioManager.getStreamVolume(AudioManager.STREAM_MUSIC)
                              val step = if (deltaY < -18f) 1 else if (deltaY > 18f) -1 else 0
                              if (step != 0) {
                                  val newV = (curV + step).coerceIn(0, maxV)
                                  audioManager.setStreamVolume(AudioManager.STREAM_MUSIC, newV, 0)
                                  hudText = "Volume ${((newV.toFloat() / maxV) * 100).roundToInt()}%"
                              }
                          }
                      )
                  }
                  IconButton(onClick = onBack, modifier = Modifier.align(Alignment.TopStart).padding(12.dp).background(Color.Black.copy(alpha = 0.4f), CircleShape)) {
                      Icon(Icons.Default.ArrowBack, null, tint = Color.White)
                  }
                  AnimatedVisibility(visible = hudText != null, enter = fadeIn(), exit = fadeOut(), modifier = Modifier.align(Alignment.Center)) {
                      Text(hudText ?: "", color = Color.White, fontWeight = FontWeight.Bold, modifier = Modifier.background(Color.Black.copy(alpha = 0.75f), RoundedCornerShape(24.dp)).padding(horizontal = 20.dp, vertical = 12.dp))
                  }
                  if (showSpeedSheet) {
                      ModalBottomSheet(onDismissRequest = { showSpeedSheet = false }, containerColor = Color(0xFF1A1A1A)) {
                          Column(modifier = Modifier.padding(16.dp)) {
                              Text("Playback Speed", fontWeight = FontWeight.Bold, fontSize = 18.sp, color = Color.White)
                              listOf(0.5f, 0.75f, 1.0f, 1.25f, 1.5f, 1.75f, 2.0f, 2.25f).forEach { spd ->
                                  Row(modifier = Modifier.fillMaxWidth().clickable { playbackSpeed = spd; showSpeedSheet = false }.padding(vertical = 12.dp), horizontalArrangement = Arrangement.SpaceBetween) {
                                      Text("${spd}x", color = if (playbackSpeed == spd) accentColor else Color.White, fontWeight = FontWeight.Bold)
                                  }
                              }
                          }
                      }
                      }
              }
          }

          @OptIn(UnstableApi::class)
          @Composable
          fun SingleShortPlayerPage(
              video: VideoFile, isCurrentPage: Boolean, accentColor: Color, playbackSpeed: Float, endBehavior: EndBehavior,
              brightnessGesture: Boolean, volumeGesture: Boolean, onOpenSpeedMenu: () -> Unit, onIncrementView: () -> Unit,
              onAdvanceNext: () -> Unit, onBrightnessDelta: (Float) -> Unit, onVolumeDelta: (Float) -> Unit
          ) {
              val context = LocalContext.current
              var isPaused by remember { mutableStateOf(false) }
              var progress by remember { mutableFloatStateOf(0f) }
              var duration by remember { mutableLongStateOf(1L) }
              val exoPlayer = remember(video.uri) { ExoPlayer.Builder(context).build().apply { setMediaItem(MediaItem.fromUri(video.uri)); prepare() } }

              DisposableEffect(exoPlayer, endBehavior) {
                  exoPlayer.repeatMode = if (endBehavior == EndBehavior.LOOP) Player.REPEAT_MODE_ONE else Player.REPEAT_MODE_OFF
                  val listener = object : Player.Listener {
                      override fun onPlaybackStateChanged(state: Int) {
                          if (state == Player.STATE_ENDED) {
                              if (endBehavior == EndBehavior.NEXT) onAdvanceNext() else if (endBehavior == EndBehavior.STOP) isPaused = true
                          }
                      }
                  }
                  exoPlayer.addListener(listener)
                  onDispose { exoPlayer.removeListener(listener) }
              }
              LaunchedEffect(playbackSpeed) { exoPlayer.playbackParameters = PlaybackParameters(playbackSpeed) }
              LaunchedEffect(isCurrentPage) {
                  if (isCurrentPage) { isPaused = false; exoPlayer.playWhenReady = true; onIncrementView() } else exoPlayer.pause()
              }
              LaunchedEffect(isCurrentPage, isPaused) {
                  while (isCurrentPage && !isPaused) {
                      duration = exoPlayer.duration.coerceAtLeast(1L)
                      progress = (exoPlayer.currentPosition.toFloat() / duration.toFloat()).coerceIn(0f, 1f)
                      delay(100)
                  }
              }
              DisposableEffect(Unit) { onDispose { exoPlayer.release() } }

              Box(modifier = Modifier.fillMaxSize()) {
                  AndroidView(factory = { ctx ->
                      PlayerView(ctx).apply {
                          player = exoPlayer; useController = false; resizeMode = AspectRatioFrameLayout.RESIZE_MODE_FIT
                          layoutParams = FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT)
                      }
                  }, modifier = Modifier.fillMaxSize())

                  Row(modifier = Modifier.fillMaxSize()) {
                      Box(modifier = Modifier.weight(0.25f).fillMaxHeight()
                          .pointerInput(Unit) { detectTapGestures { if (exoPlayer.isPlaying) { exoPlayer.pause(); isPaused = true } else { exoPlayer.play(); isPaused = false } } }
                          .then(if (brightnessGesture) Modifier.pointerInput(Unit) { detectVerticalDragGestures { c, d -> c.consume(); onBrightnessDelta(d) } } else Modifier))
                      Box(modifier = Modifier.weight(0.50f).fillMaxHeight()
                          .pointerInput(Unit) { detectTapGestures { if (exoPlayer.isPlaying) { exoPlayer.pause(); isPaused = true } else { exoPlayer.play(); isPaused = false } } })
                      Box(modifier = Modifier.weight(0.25f).fillMaxHeight()
                          .pointerInput(Unit) { detectTapGestures { if (exoPlayer.isPlaying) { exoPlayer.pause(); isPaused = true } else { exoPlayer.play(); isPaused = false } } }
                          .then(if (volumeGesture) Modifier.pointerInput(Unit) { detectVerticalDragGestures { c, d -> c.consume(); onVolumeDelta(d) } } else Modifier))
                  }

                  AnimatedVisibility(visible = isPaused, enter = fadeIn(), exit = fadeOut(), modifier = Modifier.fillMaxSize()) {
                      Box(modifier = Modifier.fillMaxSize()) {
                          Box(modifier = Modifier.align(Alignment.Center).size(72.dp).background(Color.Black.copy(alpha = 0.55f), CircleShape), contentAlignment = Alignment.Center) {
                              Icon(Icons.Default.PlayArrow, null, tint = Color.White, modifier = Modifier.size(44.dp))
                          }
                          IconButton(onClick = onOpenSpeedMenu, modifier = Modifier.align(Alignment.TopEnd).padding(12.dp).background(Color.Black.copy(alpha = 0.55f), CircleShape)) {
                              Icon(Icons.Default.MoreVert, null, tint = Color.White)
                          }
                      }
                  }
                  Slider(
                      value = progress, onValueChange = { progress = it; exoPlayer.seekTo((it * duration).toLong()) },
                      colors = SliderDefaults.colors(thumbColor = accentColor, activeTrackColor = accentColor),
                      modifier = Modifier.fillMaxWidth().align(Alignment.BottomCenter).height(18.dp)
                  )
              }
          }

          @Composable
          fun SettingsScreen(
              accentHex: Long, onAccentChange: (Long) -> Unit, columns: Int, onColumnsChange: (Int) -> Unit,
              endBehavior: EndBehavior, onEndBehaviorChange: (EndBehavior) -> Unit, brightnessGesture: Boolean, onBrightnessGestureChange: (Boolean) -> Unit,
              volumeGesture: Boolean, onVolumeGestureChange: (Boolean) -> Unit, folderUris: List<String>, onAddFolder: () -> Unit,
              onRemoveFolder: (String) -> Unit, onBack: () -> Unit
          ) {
              BackHandler(onBack = onBack)
              val context = LocalContext.current
              val accentColor = Color(accentHex)
              LazyColumn(modifier = Modifier.fillMaxSize().padding(16.dp), verticalArrangement = Arrangement.spacedBy(16.dp)) {
                  item {
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          IconButton(onClick = onBack) { Icon(Icons.Default.ArrowBack, null, tint = Color.White) }
                          Text("Settings", fontSize = 22.sp, fontWeight = FontWeight.Bold, color = Color.White)
                      }
                  }
                  item {
                      Column(modifier = Modifier.fillMaxWidth().clip(RoundedCornerShape(16.dp)).background(Color(0xFF1A1A1A)).padding(16.dp)) {
                          Text("Visual & Grid", color = accentColor, fontWeight = FontWeight.Bold)
                          Spacer(Modifier.height(8.dp))
                          Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                              listOf(1, 2, 3, 4).forEach { col -> FilterChip(selected = columns == col, onClick = { onColumnsChange(col) }, label = { Text("${col}x") }) }
                          }
                          Spacer(Modifier.height(12.dp))
                          Row(horizontalArrangement = Arrangement.spacedBy(14.dp)) {
                              ACCENT_PRESETS.forEach { preset ->
                                  Box(modifier = Modifier.size(36.dp).clip(CircleShape).background(Color(preset.hex)).border(if (accentHex == preset.hex) 3.dp else 0.dp, Color.White, CircleShape).clickable { onAccentChange(preset.hex) })
                              }
                          }
                      }
                  }
                  item {
                      Column(modifier = Modifier.fillMaxWidth().clip(RoundedCornerShape(16.dp)).background(Color(0xFF1A1A1A)).padding(16.dp)) {
                          Text("On Video End", color = accentColor, fontWeight = FontWeight.Bold)
                          Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                              EndBehavior.values().forEach { mode -> FilterChip(selected = endBehavior == mode, onClick = { onEndBehaviorChange(mode) }, label = { Text(mode.label) }) }
                          }
                      }
                  }
                  item {
                      Column(modifier = Modifier.fillMaxWidth().clip(RoundedCornerShape(16.dp)).background(Color(0xFF1A1A1A)).padding(16.dp)) {
                          Text("Gestures", color = accentColor, fontWeight = FontWeight.Bold)
                          Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                              Text("Brightness Swipe (Left)", color = Color.White)
                              Switch(checked = brightnessGesture, onCheckedChange = onBrightnessGestureChange)
                          }
                          Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                              Text("Volume Swipe (Right)", color = Color.White)
                              Switch(checked = volumeGesture, onCheckedChange = onVolumeGestureChange)
                          }
                      }
                  }
                  item {
                      Column(modifier = Modifier.fillMaxWidth().clip(RoundedCornerShape(16.dp)).background(Color(0xFF1A1A1A)).padding(16.dp)) {
                          Text("Directories", color = accentColor, fontWeight = FontWeight.Bold)
                          folderUris.forEach { uriStr ->
                              val name = remember(uriStr) { DocumentFile.fromTreeUri(context, Uri.parse(uriStr))?.name ?: uriStr }
                              Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                                  Text(name, color = Color.White, modifier = Modifier.weight(1f))
                                  IconButton(onClick = { onRemoveFolder(uriStr) }) { Icon(Icons.Default.Delete, null, tint = Color.Red) }
                              }
                          }
                          Button(onClick = onAddFolder, colors = ButtonDefaults.buttonColors(containerColor = accentColor), modifier = Modifier.fillMaxWidth()) { Text("Add Folder") }
                      }
                  }
              }
          }
          EOF

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: LocalShorts-APK
          path: app/build/outputs/apk/debug/app-debug.apk
                      
