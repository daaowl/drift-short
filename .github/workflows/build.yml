name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7 --no-daemon

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          touch build.log
          grep -E "^e: |error:|What went wrong|Could not|Unresolved|Execution failed|AAPT|> " build.log | grep -v "^> Task" | head -80 > errs.txt || true
          [ -s errs.txt ] || tail -60 build.log > errs.txt
          msg=$(sed -e ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' errs.txt)
          echo "::error title=Build failed::$msg"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hollow-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish as the latest download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Hollow.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Hollow.apk --target "$GITHUB_SHA" --prerelease \
            --title "Hollow latest build" --notes "Built from ${GITHUB_SHA::7}. Install over the previous version."
